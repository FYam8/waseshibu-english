name: G0 G1 isolated audit
on:
  push:
    branches: ['fix/english-g0-g1-isolated-audit']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/g0-publication.test.mjs
      - name: Audit structure and connector remediation route
        run: node tests/g2-content-audit.mjs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Install isolated test dependency
        run: npm install --prefix "$RUNNER_TEMP/g1-deps" --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/g1-deps/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise built production index
        env:
          G1_PLAYWRIGHT_MODULE: ${{ runner.temp }}/g1-deps/node_modules/playwright
        run: node tests/g0-g1-browser.test.mjs _site ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-g1-${{ matrix.width }}
          path: g0-g1-results/

name: verify
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/shared-engine-contract.test.mjs
      - run: node tests/shared-engine-bootstrap.test.mjs
      - run: node tests/shared-engine-core-parity.test.mjs
      - run: node tests/shared-engine-remediation-mastery-parity.test.mjs
      - run: node tests/waseda-remediation-mastery-delegation.test.mjs
      - run: node tests/waseda-daily-remediation-scheduling-characterization.test.mjs
      - run: node tests/shared-engine-daily-remediation-scheduling-parity.test.mjs
      - run: node tests/waseda-daily-remediation-scheduling-delegation.test.mjs
      - run: node tests/waseda-daily-plan-construction-characterization.test.mjs
      - run: node tests/shared-engine-daily-plan-construction-parity.test.mjs
      - run: node tests/waseda-daily-plan-construction-delegation.test.mjs
      - run: node tests/shared-engine-today-action-selection-parity.test.mjs
      - run: node tests/waseda-today-action-selection-delegation.test.mjs
      - run: node tests/waseda-practice-selection-characterization.test.mjs
      - run: node tests/shared-engine-practice-selection-parity.test.mjs
      - run: node tests/waseda-practice-selection-delegation.test.mjs
      - run: node tests/waseda-practice-ranking-session-characterization.test.mjs
      - run: node tests/shared-engine-practice-ranking-session-parity.test.mjs
      - run: node tests/waseda-practice-ranking-session-delegation.test.mjs
      - run: node tests/waseda-practice-session-state-characterization.test.mjs
      - run: node tests/shared-engine-practice-session-state-parity.test.mjs
      - run: node tests/waseda-policy-delegation.test.mjs
      - run: node tests/waseda-runtime-config-delegation.test.mjs
      - run: node tests/waseda-score-model-characterization.test.mjs
      - run: node tests/waseda-app-score-config-delegation.test.mjs
      - run: node tests/waseda-learning-model-characterization.test.mjs
      - run: node tests/shared-engine-learning-migration-parity.test.mjs
      - run: node tests/waseda-learning-migration-delegation.test.mjs
      - run: node tests/waseda-persistence-characterization.test.mjs
      - run: node tests/waseda-storage-config-delegation.test.mjs
      - run: node tests/waseda-progress-sync-characterization.test.mjs
      - run: node tests/waseda-progress-sync-config-delegation.test.mjs
      - run: node tests/waseda-progress-projection-config-delegation.test.mjs
      - run: node tests/waseda-behavior-characterization.test.mjs
      - run: node tests/waseda-learning-flow-characterization.test.mjs
      - run: bash tests/waseda-browser-smoke.sh
      - run: node --check progress-sync.js
      - run: node tests/progress-cloud-sync.test.mjs
      - run: node tests/ai-writing-grader.test.mjs
      - run: node tests/ai-writing-ui.test.mjs
      - run: node --check workers/writing-grader/src/index.mjs
      - run: node tests/ai-grading-goldset-v1/lint.mjs tests/ai-grading-goldset-v1
      - run: node tests/ai-grading-goldset-v1/smoke.mjs tests/ai-grading-goldset-v1
      - run: node --check tests/ai-grading-goldset-v1/run-cloudflare-eval.mjs
      - run: node --check tests/ai-grading-goldset-v1/reconcile-adjudication.mjs
      - run: node --check tests/ai-grading-goldset-v1/compare-evals.mjs
      - run: node tests/ai-grading-goldset-v1/compare-smoke.mjs tests/ai-grading-goldset-v1
      - run: node tests/ai-grading-goldset-v1/generate-adjudication-packet.mjs tests/ai-grading-goldset-v1 > /tmp/adjudication.json
